<text x="458" y="353" text-anchor="end" font-size="15" fill="#1d2433"><tspan font-weight="700">LM2596</tspan> <tspan fill="#5b6475">5 V out (+5V rail)</tspan></text>
<circle cx="650" cy="394" r="7" fill="#ffffff" stroke="#c9d1de" stroke-width="2"/>
