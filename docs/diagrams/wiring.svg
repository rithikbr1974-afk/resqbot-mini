<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1340" viewBox="0 0 1600 1340" font-family="Segoe UI, Arial, sans-serif">
<rect width="1600" height="1340" fill="#ffffff"/>
<text x="40" y="54" font-size="28" font-weight="800" fill="#1d2433">ResQBot Mini — wiring (Arduino Uno main board + ESP32-CAM)</text>
<text x="40" y="84" font-size="15" fill="#5b6475">Pins match firmware/ResQBot_Uno/config.h. All grounds are joined. Every sensor runs on 5 V; only Uno D1 → ESP32-CAM IO13 needs the 1k/2k divider.</text>
