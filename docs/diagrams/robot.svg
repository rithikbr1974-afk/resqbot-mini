<svg xmlns="http://www.w3.org/2000/svg" width="1300" height="760" viewBox="0 0 1300 760" font-family="Segoe UI, Arial, sans-serif">
  <defs>
    <style>
      .lbl{font-size:19px;font-weight:700;fill:#1d2433}
      .sub{font-size:15px;fill:#5b6475}
      .lead{stroke:#8a94a6;stroke-width:1.8;fill:none}
      .dot{fill:#1d2433}
    </style>
    <linearGradient id="floor" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#eef1f6"/><stop offset="1" stop-color="#ffffff"/>
    </linearGradient>
    <radialGradient id="heat" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff2e4d" stop-opacity=".55"/><stop offset=".6" stop-color="#ff6b1a" stop-opacity=".25"/>
      <stop offset="1" stop-color="#ffd23f" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1300" height="760" fill="#ffffff"/>
  <rect x="0" y="585" width="1300" height="175" fill="url(#floor)"/>
  <line x1="0" y1="585" x2="1300" y2="585" stroke="#d5dbe5" stroke-width="2"/>

  <!-- IR view cone toward a heat source -->
  <path d="M760,268 L1180,170 L1180,330 Z" fill="#ff6b1a" opacity=".10"/>
  <line x1="760" y1="268" x2="1180" y2="250" stroke="#ff6b1a" stroke-width="2" stroke-dasharray="8 6"/>
  <ellipse cx="1150" cy="250" rx="110" ry="90" fill="url(#heat)"/>
  <text x="1150" y="390" text-anchor="middle" class="sub">25° IR view → body heat</text>

  <!-- wheels -->
  <g>
    <circle cx="385" cy="535" r="62" fill="#1d2433"/><circle cx="385" cy="535" r="40" fill="#3a4354"/>
    <circle cx="385" cy="535" r="14" fill="#ffd23f"/>
    <circle cx="715" cy="535" r="62" fill="#1d2433"/><circle cx="715" cy="535" r="40" fill="#3a4354"/>
    <circle cx="715" cy="535" r="14" fill="#ffd23f"/>
    <g stroke="#2a3342" stroke-width="5">
      <line x1="330" y1="510" x2="345" y2="500"/><line x1="440" y1="510" x2="425" y2="500"/>
      <line x1="660" y1="510" x2="675" y2="500"/><line x1="770" y1="510" x2="755" y2="500"/>
    </g>
  </g>
  <!-- motors -->
  <rect x="425" y="496" width="70" height="34" rx="6" fill="#ffd23f"/>
  <rect x="605" y="496" width="70" height="34" rx="6" fill="#ffd23f"/>

  <!-- lower deck -->
  <rect x="300" y="470" width="500" height="18" rx="6" fill="#ff6b1a"/>
  <!-- battery pack -->
  <rect x="345" y="420" width="160" height="46" rx="10" fill="#2a78d6"/>
  <text x="425" y="449" text-anchor="middle" font-size="14" font-weight="800" fill="#fff">2×18650</text>
  <!-- L298N -->
  <rect x="540" y="414" width="110" height="52" rx="6" fill="#d6336c"/>
  <rect x="560" y="400" width="34" height="20" fill="#1d2433"/>
  <text x="595" y="447" text-anchor="middle" font-size="13" font-weight="800" fill="#fff">L298N</text>
  <!-- standoffs -->
  <g fill="#b9c1ce"><rect x="318" y="370" width="10" height="100"/><rect x="772" y="370" width="10" height="100"/>
  <rect x="520" y="370" width="10" height="100"/></g>
  <!-- upper deck -->
  <rect x="300" y="352" width="500" height="18" rx="6" fill="#ff6b1a"/>

  <!-- ultrasonic on front of lower deck -->
  <rect x="800" y="420" width="26" height="70" rx="4" fill="#2a78d6"/>
  <circle cx="842" cy="438" r="17" fill="#c9d1de" stroke="#8a94a6" stroke-width="3"/>
  <circle cx="842" cy="474" r="17" fill="#c9d1de" stroke="#8a94a6" stroke-width="3"/>

  <!-- ESP32 + LM2596 on top deck -->
  <rect x="340" y="318" width="150" height="34" rx="5" fill="#1d2433"/>
  <rect x="352" y="324" width="54" height="22" rx="2" fill="#c9d1de"/>
  <text x="450" y="340" text-anchor="middle" font-size="12" font-weight="800" fill="#ffd8c2">UNO</text>
  <rect x="500" y="324" width="70" height="28" rx="4" fill="#2a78d6"/>
  <!-- MQ-2 -->
  <rect x="585" y="326" width="40" height="26" fill="#1baf7a"/>
  <rect x="590" y="296" width="30" height="30" rx="4" fill="#c9d1de" stroke="#8a94a6" stroke-width="2"/>
  <!-- PIR dome -->
  <rect x="300" y="330" width="34" height="22" fill="#1baf7a"/>
  <path d="M296,330 A21,21 0 0 1 338,330 Z" fill="#f6f8fb" stroke="#8a94a6" stroke-width="2"/>
  <!-- beacon mast -->
  <rect x="660" y="250" width="8" height="102" fill="#8a94a6"/>
  <circle cx="664" cy="242" r="16" fill="#e5383b"/>
  <circle cx="664" cy="242" r="30" fill="#e5383b" opacity=".18"/>
  <!-- pan-tilt with MLX tube -->
  <rect x="700" y="318" width="44" height="34" rx="4" fill="#3a4354"/>
  <rect x="712" y="284" width="20" height="36" fill="#3a4354"/>
  <rect x="704" y="250" width="40" height="36" rx="5" fill="#3a4354"/>
  <rect x="738" y="256" width="44" height="22" rx="4" fill="#1d2433" transform="rotate(-3 738 256)"/>
  <circle cx="744" cy="267" r="7" fill="#c9d1de"/>
  <!-- ESP32-CAM on front -->
  <rect x="790" y="312" width="40" height="40" rx="4" fill="#1d2433"/>
  <circle cx="818" cy="332" r="11" fill="#3a4354" stroke="#c9d1de" stroke-width="3"/>
  <circle cx="818" cy="332" r="4" fill="#4da3ff"/>

  <!-- callouts -->
  <g>
    <circle class="dot" cx="760" cy="266" r="4"/><path class="lead" d="M760,266 L860,120"/>
    <text x="866" y="104" class="lbl">MLX90614 thermal sensor</text>
    <text x="866" y="126" class="sub">in a 25° tube, on pan-tilt servos</text>

    <circle class="dot" cx="818" cy="332" r="4"/><path class="lead" d="M818,332 L960,520"/>
    <text x="966" y="526" class="lbl">ESP32-CAM</text>
    <text x="966" y="548" class="sub">Wi-Fi, dashboard, live video, flash</text>

    <circle class="dot" cx="842" cy="456" r="4"/><path class="lead" d="M858,456 L960,640"/>
    <text x="966" y="646" class="lbl">HC-SR04 ultrasonic</text>
    <text x="966" y="668" class="sub">obstacle and approach distance</text>

    <circle class="dot" cx="664" cy="242" r="4"/><path class="lead" d="M664,242 L610,140"/>
    <text x="470" y="104" class="lbl">LED beacon + buzzer</text>
    <text x="470" y="126" class="sub">marks a found survivor</text>

    <circle class="dot" cx="605" cy="300" r="4"/><path class="lead" d="M605,300 L560,215"/>
    <text x="420" y="190" class="lbl">MQ-2 smoke/gas</text>
    <text x="420" y="212" class="sub">hazard alert</text>

    <circle class="dot" cx="317" cy="320" r="4"/><path class="lead" d="M317,320 L230,230"/>
    <text x="60" y="206" class="lbl">PIR motion sensor</text>
    <text x="60" y="228" class="sub">is the person moving?</text>

    <circle class="dot" cx="372" cy="335" r="4"/><path class="lead" d="M372,335 L345,358 L250,358"/>
    <text x="60" y="352" class="lbl">Arduino Uno brain</text>
    <text x="60" y="374" class="sub">reads all sensors</text>

    <circle class="dot" cx="347" cy="443" r="4"/><path class="lead" d="M347,443 L245,450"/>
    <text x="60" y="440" class="lbl">2 × 18650 battery</text>
    <text x="60" y="462" class="sub">7.4 V, ~1 h of searching</text>

    <circle class="dot" cx="385" cy="535" r="4"/><path class="lead" d="M385,535 L240,600"/>
    <text x="60" y="600" class="lbl">4WD BO-motor chassis</text>
    <text x="60" y="622" class="sub">L298N drive, skid steering</text>
  </g>
  <text x="40" y="52" font-size="28" font-weight="800" fill="#1d2433">ResQBot Mini — concept (side view)</text>
  <text x="40" y="80" font-size="15" fill="#5b6475">about 26 × 15 × 20 cm · ~0.9 kg · Arduino Uno + ESP32-CAM + DHT11</text>
</svg>
